[package]
name = "openmw-config"
description = "A library for interacting with the Openmw Configuration system."
version = "2.0.1"
authors = ["Dave Corley (S3kshun8) <corleycomputerrepair@protonmail.ch>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/DreamWeave-MP/Openmw_Config"
homepage = "https://dreamweave-mp.github.io/Openmw_Config/"
documentation = "https://dreamweave-mp.github.io/Openmw_Config/docs/"
readme = "README.md"
# The crate is the library. The website beside it (content/, templates/, sass/, static/, tools/)
# is published to GitHub Pages, not crates.io.
include = ["/src", "/benches", "/tests", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
keywords = ["openmw", "config", "parsing", "gamedev"]
categories = ["config", "game-engines", "parsing"]
edition = "2024"
rust-version = "1.88"

[dependencies]
# The Luau bindings are an l3i extension; a path dependency for the migration campaign, the
# crates.io version at release.
l3i = { path = "../dream-binder", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[features]
default = []
# The Luau bindings: `openmw_config::luau::extension()` for an l3i runtime plan.
luau = ["dep:l3i"]
# Luau's analysis frontend through l3i, for this crate's own type-definition gate in `tests/`.
luau-analysis = ["luau", "l3i/analysis"]

[package.metadata.docs.rs]
features = ["luau"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11.0"

[[bench]]
name = "parsing"
harness = false

[[bench]]
name = "luau_boundary"
harness = false
required-features = ["luau"]
