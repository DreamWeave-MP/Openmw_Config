    "`to_resolved_string` and `save_resolved_to_path`: a flattened export with resolved paths and no `config=` or `replace=` entries.",
    "The same four in Lua: `newEmpty`, `loadOptional`, `toResolvedString`, `saveResolvedToPath`.",
]

[[releases]]
