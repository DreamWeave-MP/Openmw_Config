]
fixed = ["A config loaded through a symlink keeps the path it was loaded from."]

[[releases]]
version = "2.0.0"
date = 2026-09-26
summary = "The Lua bindings run on Luau."
breaking = [
    "The bindings build against `mlua` 0.12 and the `lua` feature no longer selects a Lua runtime: the host application picks one through its own `mlua` dependency. `standalone-lua` selects Luau for this crate's tests and docs. The Lua API itself is unchanged.",
]
migration = """
Add `mlua` to your own dependencies with the runtime you embed, and keep `features = ["lua"]` on
this crate:

```toml
openmw-config = { version = "2", features = ["lua"] }
mlua = { version = "0.12", default-features = false, features = ["luau"] }
```
"""

