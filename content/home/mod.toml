# openmw-config. Structured facts only: the name and summary are `title` and `description` in
# index.md. Every key is explained at
# https://dreamweave-mp.github.io/DreamWeave-Mod-Template/guide/mod-toml/

# Permanent identity. Never changes, whatever the crate is called or wherever it is hosted.
id = "3aaf4fe0-616f-41a3-b520-306eda9347b0"

slug = "openmw_config"
type = "library"
license = "MIT OR Apache-2.0"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[links]
documentation = "@/docs/_index.md"
support = "https://github.com/DreamWeave-MP/Openmw_Config/discussions"
donate = "https://ko-fi.com/magicaldave"

# A Rust library. StroggForge's library workflow (.github/workflows/ci.yml) tests it on every push;
# pushing a bare version tag, like 3.0.0, publishes that version to crates.io and records it here.
[package]
format = "crate"
crate = "openmw-config"

[[recommends]]
name = "vfstool_lib"
url = "https://crates.io/crates/vfstool_lib"
reason = "Builds OpenMW's virtual file system from the data directories this crate resolves."

[[credits]]
name = "Benjamin Winger"
role = "Made the encoding value public"
url = "https://github.com/benjaminwinger"

# Every version on crates.io, oldest first. To release, add the next one here with the day you
# publish it, set the same version in Cargo.toml, commit, and push its tag: git tag 2.0.2.

