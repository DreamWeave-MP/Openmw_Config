manifest_version = 1

[package]
id = "org.dreamweave.openmw-config"
version = "4.0.0"
jess_api = "1"
include = ["src", "tests"]
tests = ["tests/run.jsl", "tests/grammar.jsl", "tests/style.jsl"]

[modules]
"@openmw-config" = "src/init.jsl"
# Exported for openmw, whose Context validates content names with the grammar and compares folders
# by the chain's path key, and for openmw-import-morrowind, which validates, resolves, and quotes
# the settings it writes. They are not the configuration API.
"@openmw-config/text" = "src/text.jsl"
"@openmw-config/paths" = "src/paths.jsl"

# Every module here is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it.

[[layer]]
id = "openmw-config.core"
exports = ["@openmw-config", "@openmw-config/text", "@openmw-config/paths"]
